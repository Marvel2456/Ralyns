{% include 'store/partials/cart_drawer_items.html' %}

<!-- Out-of-band updates for cart badge counters on desktop and mobile -->
<span id="cart-badge-counter" 
      hx-swap-oob="outerHTML" 
      class="absolute -top-1 -right-1 min-w-[20px] h-5 px-1 bg-brand-orange text-white text-[11px] font-black rounded-full flex items-center justify-center shadow-md transition-all duration-300 {% if not cart.item_count or cart.item_count == 0 %}hidden{% endif %}">
    {{ cart.item_count|default:0 }}
</span>

<span id="mobile-cart-badge-counter" 
      hx-swap-oob="outerHTML" 
      class="px-2 py-0.5 rounded-full text-xs font-bold bg-amber-500/10 text-brand-orange border border-amber-500/20">
    {{ cart.item_count|default:0 }}
</span>
